server:
  port: 8080
spring:
  application:
    name: "FranchiseApi"
  devtools:
    add-properties: false
  mongodb:
    uri: "${MONGODB_URI:mongodb://localhost:27017/franchises}"
  data:
    mongodb:
      auto-index-creation: true
springdoc:
  pre-loading-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
